[project]
name = "chatbot-saas"
version = "0.1.0"
description = "RAG Chatbot SaaS Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "datasets>=5.0.1",
    "fastapi[all,standard]>=0.139.0",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "langchain>=1.3.13",
    "langchain-aws>=1.6.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "langchain-experimental>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.53.0",
    "pandas>=3.0.5",
    "passlib>=1.7.4",
    "pdfplumber>=0.11.10",
    "pgvector>=0.3.6",
    "psycopg2>=2.9.12",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "ragas>=0.4.3",
    "redis>=8.1.0",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "unstructured>=0.25.2",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
